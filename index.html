<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배움문화팀 프로그램 안내</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#222}
header{background:#0f766e;color:#fff;padding:28px 20px}
main{max-width:720px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:bold}
.grid{display:grid;gap:12px}
.row{display:flex;justify-content:space-between;margin:6px 0}
footer{text-align:center;color:#666;padding:30px 10px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>배움문화팀 프로그램 안내</h1>
  <p>양천해누리복지관 · 시범운영</p>
</header>
<main>
  <div class="card">
    <h2>시범운영 안내</h2>
    <p>이 페이지는 개인 블로그 테스트용입니다. 프로그램 정보는 배움문화팀 최신 운영자료를 기준으로 순차 업데이트됩니다.</p>
  </div>
  <div class="grid">
    <div class="card">
      <span class="badge">모집중</span>
      <h3>원예교실</h3>
      <div class="row"><b>대상</b><span>성인</span></div>
      <div class="row"><b>일정</b><span>매주 화요일</span></div>
      <div class="row"><b>문의</b><span>070-4804-6052</span></div>
    </div>
    <div class="card">
      <span class="badge">운영중</span>
      <h3>해누리합창단</h3>
      <div class="row"><b>일정</b><span>매주 목 10:00</span></div>
      <div class="row"><b>장소</b><span>강당</span></div>
      <div class="row"><b>문의</b><span>070-4804-6050</span></div>
    </div>
    <div class="card">
      <span class="badge">모집예정</span>
      <h3>테마여행</h3>
      <div class="row"><b>신청</b><span>10/1 ~ 10/8</span></div>
      <div class="row"><b>운영</b><span>10/21</span></div>
      <div class="row"><b>문의</b><span>070-4804-6053</span></div>
    </div>
  </div>
</main>
<footer>© 양천해누리복지관 배움문화팀</footer>
</body>
</html>
